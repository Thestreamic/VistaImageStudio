# Manual run, or every push to main.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_path:
        description: "URL prefix. Leave empty to auto-detect. Use / or root for a custom domain (site at /). Use /RepoName for user.github.io/RepoName."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder (package.json)
        id: app
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Found package.json at repository root"
            exit 0
          fi
          found=""
          for d in */package.json; do
            [ -f "$d" ] || continue
            found=$(dirname "$d")
            break
          done
          if [ -z "$found" ]; then
            echo "::error::package.json is missing. Copy the Git folder CONTENTS into the repo root (you must see package.json next to .gitignore)."
            echo "Repo layout:"
            find . -maxdepth 3 -not -path './.git/*' | head -80
            exit 1
          fi
          echo "dir=$found" >> "$GITHUB_OUTPUT"
          echo "Found package.json in $found"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.app.outputs.dir }}
      - name: Resolve GitHub Pages base path
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT="${{ github.event.inputs.base_path }}"
          if [ "$INPUT" = "/" ] || [ "$INPUT" = "root" ] || [ "$INPUT" = "none" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Using site root (workflow override)"
            exit 0
          fi
          if [ -n "$INPUT" ]; then
            echo "path=$INPUT" >> "$GITHUB_OUTPUT"
            echo "Using override $INPUT"
            exit 0
          fi

          # Custom domains are always served at / — /repo-name CSS URLs 404 there.
          if [ -f CNAME ] || [ -f public/CNAME ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "CNAME file present — using site root"
            exit 0
          fi
          PAGES_JSON=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" || true)
          CNAME=$(printf '%s' "$PAGES_JSON" | python -c "import sys,json
try:
  d=json.load(sys.stdin)
  print(d.get('cname') or '')
except Exception:
  print('')")
          if [ -n "$CNAME" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Custom domain $CNAME — using site root"
            exit 0
          fi

          OWNER="${{ github.repository_owner }}"
          NAME="${{ github.event.repository.name }}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${NAME}" >> "$GITHUB_OUTPUT"
            echo "Project Pages URL — prefix /${NAME}"
          fi
      - name: Export static web
        run: npm run build:web
        working-directory: ${{ steps.app.outputs.dir }}
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          STRICT_MODELS: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.app.outputs.dir }}/out-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
